---
apiVersion: apps/v1
kind: Deployment
metadata:
 name: productsapideployment
spec:
 replicas: 1
 selector:
   matchLabels:
     app: products
 template:
  metadata:
   name: products
   labels:
     app: products
  spec:
    containers:
    - name: productscontainer
      image: sairam7892/products:latest
      ports:
      - containerPort: 8080
---
# apiVersion: v1
# kind: Service
# metadata:
#  name: productssvc
# spec:
#   type: NodePort
#   selector:
#    app: products
#   ports:
#    - port: 80
#      targetPort: 8080
apiVersion: v1
kind: Service
metadata:
  name: productssvc
spec:
  type: NodePort
  selector:
    app: products
  ports:
    - port: 8080         # Internal cluster service port
      targetPort: 8080   # Port exposed inside the container
      nodePort: 30080

...
